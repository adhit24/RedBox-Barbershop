name: One-time Moka schedule conflict patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "github.event.head_commit.message != 'fix(sync): preflight Moka schedule conflicts'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch sync conflict handling
        run: python .github/scripts/patch_moka_conflicts.py

      - name: Syntax and diff checks
        run: |
          node --check server/moka/sync.js
          git diff --check
          grep -q "Advance appointments must keep their requested clock time" server/moka/sync.js
          grep -q "conflicting slot patch suppressed" server/moka/sync.js

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/moka/sync.js
          git commit -m "fix(sync): preflight Moka schedule conflicts"
          git push
