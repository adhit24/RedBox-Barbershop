<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RedBox — Memuat...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      color: #fff;
      gap: 20px;
      user-select: none;
    }
    .spinner {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 4px solid #222;
      border-top: 4px solid #ef4444;
      border-right: 4px solid #f5f5f5;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .welcome {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    #loading-copy {
      color: #6b7280;
      font-size: 0.85rem;
      text-align: center;
      max-width: 240px;
      line-height: 1.6;
      min-height: 2.8em;
    }
    #sync-toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      font-size: 0.78rem;
      padding: 10px 18px;
      border-radius: 12px;
      opacity: 0;
      transition: opacity 0.4s;
      text-align: center;
      max-width: 280px;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p class="welcome">Selamat datang, <span id="member-name">Sobat RedBox</span>! ✂️</p>
  <p id="loading-copy">Sedang mempersiapkan kursi hangat untukmu...</p>
  <div id="sync-toast"></div>
  <script src="js/member-loading.js?v=20260605"></script>
</body>
</html>
