name: One-time stale Moka range patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "github.event.head_commit.message != 'fix(sync): keep stale Moka bills cancelled'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch stale Open Bill handling
        run: python .github/scripts/patch_moka_stale_range.py

      - name: Syntax and diff checks
        run: |
          node --check server/moka/sync.js
          git diff --check
          grep -q "remains cancelled: computed end" server/moka/sync.js
          grep -q "invalid timing patch suppressed" server/moka/sync.js

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/moka/sync.js
          git commit -m "fix(sync): keep stale Moka bills cancelled"
          git push
